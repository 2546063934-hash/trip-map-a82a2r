if(!focus){map.fitBounds(b,{padding:[40,40],maxZoom:11});return;}
var sub=pts.filter(function(p){return p.d===focus;}).map(function(p){return [p.lat,p.lng];});
if(sub.length>1)map.fitBounds(L.latLngBounds(sub),{padding:[50,50],maxZoom:11});
else map.flyTo(sub[0],Math.max(map.getZoom(),9));
});
var playBtn=document.getElementById("play"),hud=document.getElementById("hud");
var raf=0,car=null,t0=0,dur=0,lastDay=0;
function build(){
var segs=[],tot=0;
for(var i=0;i<pts.length-1;i++){
var P=routes[i];if(!P||P.length<2)continue;
var km=(legs[i]&&legs[i].k)||1;var cum=[0],len=0;
for(var j=1;j<P.length;j++){var dx=(P[j][0]-P[j-1][0])*111,dy=(P[j][1]-P[j-1][1])*111*Math.cos(P[j][0]*PI/180);
len+=Math.sqrt(dx*dx+dy*dy);cum.push(len);}
if(len<0.001)continue;
segs.push({P:P,cum:cum,len:len,km:km,start:tot,d:pts[i+1].d,name:pts[i+1].n});tot+=km;
}
return segs.length?{segs:segs,total:tot}:null;
}
function at(km,PP){
for(var s=0;s<PP.segs.length;s++){var g=PP.segs[s];
if(km<=g.start+g.km||s===PP.segs.length-1){
var t=Math.min(1,Math.max(0,(km-g.start)/g.km)),tar=t*g.len;
var lo=0,hi=g.cum.length-1;while(hi-lo>1){var mid=(lo+hi)>>1;if(g.cum[mid]<=tar)lo=mid;else hi=mid;}
var sp=g.cum[hi]-g.cum[lo]||1,r=Math.min(1,Math.max(0,(tar-g.cum[lo])/sp));
var A=g.P[lo],B=g.P[hi];
return {lat:A[0]+(B[0]-A[0])*r,lng:A[1]+(B[1]-A[1])*r,d:g.d,name:g.name};}}
return null;}
function stop(){
if(raf)cancelAnimationFrame(raf);raf=0;
if(car){map.removeLayer(car);car=null;}
hud.className="";playBtn.className="";playBtn.textContent="▶ 播放行程";
markers.forEach(function(m){var el=m.getElement();if(el)el.style.opacity=1;});
focus=0;renderDays();}
playBtn.onclick=function(){
if(raf){stop();return;}
var PP=build();if(!PP){return;}
car=L.marker([PP.segs[0].P[0][0],PP.segs[0].P[0][1]],{icon:L.divIcon({className:"pin",html:"<b style=\"--c:#d1552b;box-shadow:0 0 0 8px rgba(209,85,43,.25)\">●</b>",iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:900,interactive:false}).addTo(map);
dur=Math.min(70000,Math.max(14000,PP.total*11));t0=performance.now();lastDay=0;
hud.className="on";playBtn.className="on";playBtn.textContent="■ 结束";
map.closePopup();
function frame(now){
var t=Math.min(1,(now-t0)/dur),pos=at(t*PP.total,PP);
if(!pos){stop();return;}
car.setLatLng([pos.lat,pos.lng]);
if(pos.d!==lastDay){lastDay=pos.d;focus=pos.d;renderDays();
markers.forEach(function(m,i){var el=m.getElement();if(el)el.style.opacity=pts[i].d===focus?1:.22;});
hud.querySelector(".hd1").textContent="DAY "+pos.d;}
hud.querySelector(".hd2").textContent=(t>.985?"到达 ":"前往 ")+pos.name;
hud.querySelector(".bar i").style.width=(t*100).toFixed(1)+"%";
hud.querySelector(".km").textContent=Math.round(t*PP.total)+" / "+Math.round(PP.total)+" km";
var sz=map.getSize(),cp=map.latLngToContainerPoint([pos.lat,pos.lng]);
if(cp.x<80||cp.y<80||cp.x>sz.x-80||cp.y>sz.y-80)map.panTo([pos.lat,pos.lng],{animate:true,duration:.5});
if(t>=1){setTimeout(stop,1200);return;}
raf=requestAnimationFrame(frame);}
raf=requestAnimationFrame(frame);
};
var gal=[];pts.forEach(function(p){p.ph.forEach(function(src){gal.push({src:src,n:p.n,d:p.d});});});
if(gal.length){
var sec=document.createElement("div");sec.className="gal";
sec.innerHTML="<h3>PHOTOS · 照片</h3><div class=\"grid\"></div>";
var g=sec.querySelector(".grid");
gal.slice(0,16).forEach(function(o){
var f=document.createElement("figure");
f.innerHTML="<img src=\""+o.src+"\" data-lb=\"1\"><figcaption>D"+o.d+" · "+o.n+"</figcaption>";
g.appendChild(f);});
document.getElementById("app").appendChild(sec);
}
var ft=document.createElement("div");ft.className="ft";
ft.innerHTML="点击圆点看照片与备注 · 点右下角「播放行程」看整条路线动起来<br>由「西北旅行地图」制作";
document.getElementById("app").appendChild(ft);
var lb=document.getElementById("lb"),lbi=document.getElementById("lbi");
document.addEventListener("click",function(e){
var t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-lb")){lb.className="on";lbi.src=t.src;}
else if(t===lb||t===lbi){lb.className="";}
});
})();};</script>
